# ============================================
# 作品画廊数据(方案 B:数据驱动)
# --------------------------------------------
# 更新一幅画只需三步:
#   1) 把图片文件放进 source/images/works/
#   2) 在下面按格式加一条记录
#   3) 跑 ./deploy.sh 上线
# --------------------------------------------
# 字段说明:
#   name  - 作品名(必填)
#   img   - 图片路径(必填,建议 /images/works/xxx.jpg)
#   tag   - 分类标签(选填,如:水彩 / 素描 / 板绘 / 速写)
#   date  - 完成日期 YYYY-MM-DD(选填,画廊按它倒序排列)
#   note  - 一句感想(选填,点开大图时显示在标题下方,卡片上也露出一行)
# ============================================

